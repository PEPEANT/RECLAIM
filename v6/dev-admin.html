<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECLAIM 로컬 관리자</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #111b2f;
            --line: #27354f;
            --text: #dce8ff;
            --muted: #8ba1c7;
            --ok: #22c55e;
            --err: #f87171;
            --warn: #fbbf24;
            --btn: #1f5ea8;
            --btn2: #13233f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #152340 0%, var(--bg) 55%);
            color: var(--text);
            font-family: "Segoe UI", "Noto Sans KR", sans-serif;
            padding: 18px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .panel {
            width: min(980px, 100%);
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.38);
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            letter-spacing: 0.3px;
        }

        .sub {
            margin: 0 0 14px 0;
            color: var(--muted);
            font-size: 13px;
        }

        .section {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            background: rgba(15, 23, 40, 0.68);
        }

        .section h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .row {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .row label {
            color: var(--muted);
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #0e1728;
            color: var(--text);
            padding: 9px 10px;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
        }

        .checks {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 8px 0 4px 0;
        }

        .checks label {
            display: inline-flex;
            gap: 7px;
            align-items: center;
            color: var(--text);
            font-size: 13px;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .slot-team h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #b5c8eb;
        }

        .slot-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 260px;
            overflow: auto;
            padding-right: 2px;
        }

        .slot-row {
            display: grid;
            grid-template-columns: 1fr 84px 58px;
            gap: 6px;
        }

        .slot-row input[type="number"] { text-align: center; }

        .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--btn2);
            color: var(--text);
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        button.primary {
            border-color: #2e7ad6;
            background: var(--btn);
        }

        button.danger {
            border-color: #83354a;
            background: #5a2231;
        }

        .status {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #0e1728;
            font-size: 13px;
            white-space: pre-wrap;
            color: var(--muted);
        }

        .tip {
            margin-top: 10px;
            font-size: 12px;
            color: var(--warn);
        }

        code {
            background: rgba(0,0,0,0.22);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 1px 6px;
        }

        details { margin-top: 8px; }

        details summary {
            cursor: pointer;
            color: #b9cff5;
            font-size: 13px;
        }

        @media (max-width: 860px) {
            .row { grid-template-columns: 1fr; }
            .slot-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>RECLAIM 로컬 관리자</h1>
        <p class="sub">로컬 빠른 테스트 전용 페이지입니다. 보안 인증 목적이 아니라 개발 편의용입니다.</p>

        <section class="section">
            <h2>기본 설정</h2>
            <div class="row">
                <label for="password">관리자 비밀번호</label>
                <input id="password" type="password" placeholder="비밀번호 입력">
            </div>
            <div class="row">
                <label for="map-id">기본 맵</label>
                <select id="map-id">
                    <option value="skirmish">국지전 기본 (skirmish)</option>
                    <option value="skirmish_kabul">카불 시가지 (skirmish_kabul)</option>
                    <option value="skirmish_desert">사막 도시 (skirmish_desert)</option>
                    <option value="plain">평원 (plain)</option>
                    <option value="mountain">산악 (mountain)</option>
                    <option value="village">마을 (village)</option>
                    <option value="forest">숲 (forest)</option>
                    <option value="fortress">요새 (fortress)</option>
                    <option value="desert">사막 (desert)</option>
                    <option value="landing">상륙전 (landing)</option>
                    <option value="city">도시 (city)</option>
                </select>
            </div>

            <div class="checks">
                <label><input id="opt-enabled" type="checkbox"> 관리자 빠른진입 사용</label>
                <label><input id="opt-skip-boot" type="checkbox"> 부트 화면 자동 건너뛰기</label>
                <label><input id="opt-open-custom" type="checkbox"> 커스텀 전투 자동 열기</label>
                <label><input id="opt-auto-start" type="checkbox"> 전투 자동 시작</label>
            </div>
        </section>

        <section class="section">
            <h2>유닛 편성</h2>
            <div class="slot-grid">
                <div class="slot-team">
                    <h3>아군 편성</h3>
                    <div id="ally-slot-list" class="slot-list"></div>
                    <div class="btns">
                        <button id="btn-ally-add" type="button">아군 슬롯 추가</button>
                        <button id="btn-ally-default" type="button">아군 기본 편성</button>
                    </div>
                </div>
                <div class="slot-team">
                    <h3>적군 편성</h3>
                    <div id="enemy-slot-list" class="slot-list"></div>
                    <div class="btns">
                        <button id="btn-enemy-add" type="button">적군 슬롯 추가</button>
                        <button id="btn-enemy-default" type="button">적군 기본 편성</button>
                    </div>
                </div>
            </div>
            <div class="btns">
                <button id="btn-both-default" type="button">양측 기본 편성으로 초기화</button>
            </div>
        </section>

        <section class="section">
            <h2>실행</h2>
            <div class="btns">
                <button id="btn-apply" class="primary" type="button">설정 저장 + 활성화</button>
                <button id="btn-disable" class="danger" type="button">비활성화</button>
                <button id="btn-open-index" type="button">index.html 열기</button>
                <button id="btn-show" type="button">현재 설정 불러오기</button>
            </div>
            <div id="status" class="status">상태 대기 중...</div>
            <p class="tip">기본 비밀번호: <code>reclaim-local-admin</code></p>
        </section>

        <section class="section">
            <details>
                <summary>고급 설정(JSON)</summary>
                <div class="row" style="margin-top:10px;">
                    <label for="ally-json">아군 슬롯 JSON</label>
                    <textarea id="ally-json" spellcheck="false"></textarea>
                </div>
                <div class="row">
                    <label for="enemy-json">적군 슬롯 JSON</label>
                    <textarea id="enemy-json" spellcheck="false"></textarea>
                </div>
                <div class="btns">
                    <button id="btn-json-apply" type="button">JSON 슬롯 반영</button>
                </div>
            </details>
        </section>
    </main>

    <script>
        (function () {
            'use strict';

            var STORAGE_KEY = 'reclaim_dev_quickstart_v1';
            var MASTER_PASSWORD = 'reclaim-local-admin';
            var MAX_SLOTS = 10;

            var UNIT_OPTIONS = [
                { id: 'worker', label: '작업자' },
                { id: 'infantry', label: '보병' },
                { id: 'special_ops', label: '특수작전병' },
                { id: 'sniper', label: '저격수' },
                { id: 'engineer', label: '공병' },
                { id: 'rpg', label: 'RPG병' },
                { id: 'humvee', label: '험비' },
                { id: 'apc', label: '장갑차' },
                { id: 'mbt', label: '전차' },
                { id: 'spg', label: '자주포' },
                { id: 'aa_tank', label: '대공전차' },
                { id: 'icbm', label: 'ICBM 차량' },
                { id: 'apache', label: '아파치' },
                { id: 'blackhawk', label: '블랙호크' },
                { id: 'fighter', label: '전투기' },
                { id: 'bomber', label: '폭격기' },
                { id: 'recon', label: '정찰기' },
                { id: 'drone_operator', label: '드론병' },
                { id: 'drone_at', label: '대전차 드론' },
                { id: 'drone_suicide', label: '자폭 드론' },
                { id: 'tactical_drone', label: '전술 드론' }
            ];
            var UNIT_ID_SET = new Set(UNIT_OPTIONS.map(function (u) { return u.id; }));

            var defaultAlly = [
                { unitId: 'mbt', count: 3 },
                { unitId: 'apc', count: 2 },
                { unitId: 'infantry', count: 8 }
            ];
            var defaultEnemy = [
                { unitId: 'mbt', count: 3 },
                { unitId: 'aa_tank', count: 2 },
                { unitId: 'infantry', count: 8 }
            ];

            var allySlotsState = [];
            var enemySlotsState = [];
            var mainGameWindow = null;

            function cloneSlots(slots) {
                if (!Array.isArray(slots)) return [];
                return slots
                    .map(function (s) {
                        var unitId = String(s && s.unitId || '').trim();
                        if (!unitId) unitId = 'infantry';
                        return {
                            unitId: unitId,
                            count: Math.max(1, Math.min(30, Math.floor(Number(s && s.count) || 1)))
                        };
                    })
                    .filter(function (s) { return !!s.unitId; })
                    .slice(0, MAX_SLOTS);
            }

            function sanitizeSlotList(input, fallback) {
                var out = cloneSlots(input);
                if (out.length <= 0) out = cloneSlots(fallback);
                return out;
            }

            function parseSlotsJson(text, fallback) {
                try {
                    var arr = JSON.parse(String(text || '[]'));
                    if (!Array.isArray(arr)) throw new Error('배열 형식이 아닙니다.');
                    return sanitizeSlotList(arr, fallback);
                } catch (err) {
                    throw new Error('JSON 형식이 올바르지 않습니다.');
                }
            }

            function getUnitLabel(unitId) {
                for (var i = 0; i < UNIT_OPTIONS.length; i++) {
                    if (UNIT_OPTIONS[i].id === unitId) return UNIT_OPTIONS[i].label;
                }
                return unitId;
            }

            function isLocalRuntime() {
                var p = String(location.protocol || '').toLowerCase();
                var h = String(location.hostname || '').toLowerCase();
                if (p === 'file:') return true;
                if (h === 'localhost' || h === '127.0.0.1' || h === '') return true;
                return false;
            }

            function readConfig() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    return JSON.parse(raw);
                } catch (_) {
                    return null;
                }
            }

            function writeConfig(cfg) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
            }

            function setStatus(msg, ok) {
                var el = document.getElementById('status');
                if (!el) return;
                var color = ok === true ? 'var(--ok)' : (ok === false ? 'var(--err)' : 'var(--muted)');
                el.style.color = color;
                el.textContent = msg;
            }

            function tryImmediateApply() {
                var targets = [];
                var seen = new Set();
                var pushTarget = function (win) {
                    if (!win) return;
                    if (seen.has(win)) return;
                    seen.add(win);
                    targets.push(win);
                };

                pushTarget(mainGameWindow);
                pushTarget(window.opener);
                if (window.parent && window.parent !== window) pushTarget(window.parent);

                var pinged = false;
                var applied = false;

                for (var i = 0; i < targets.length; i++) {
                    var target = targets[i];
                    try {
                        if (!target || target.closed) continue;
                        var api = target.RECLAIM_DEV_QUICKSTART;
                        if (!api) continue;
                        if (typeof api.applyToRunningGame === 'function') {
                            pinged = true;
                            if (api.applyToRunningGame() === true) applied = true;
                            continue;
                        }
                        if (typeof api.runNow === 'function') {
                            api.runNow();
                            pinged = true;
                        }
                    } catch (_) { }
                }

                return { pinged: pinged, applied: applied };
            }

            function createUnitSelect(selectedId, onChange) {
                var select = document.createElement('select');
                var selectedKnown = UNIT_ID_SET.has(String(selectedId || '').trim());
                if (!selectedKnown && selectedId) {
                    var custom = document.createElement('option');
                    custom.value = String(selectedId).trim();
                    custom.textContent = '커스텀 유닛 (' + String(selectedId).trim() + ')';
                    custom.selected = true;
                    select.appendChild(custom);
                }
                for (var i = 0; i < UNIT_OPTIONS.length; i++) {
                    var opt = UNIT_OPTIONS[i];
                    var option = document.createElement('option');
                    option.value = opt.id;
                    option.textContent = opt.label + ' (' + opt.id + ')';
                    if (opt.id === selectedId) option.selected = true;
                    select.appendChild(option);
                }
                select.addEventListener('change', onChange);
                return select;
            }

            function renderSlotRows(team) {
                var listEl = document.getElementById(team === 'ally' ? 'ally-slot-list' : 'enemy-slot-list');
                var state = team === 'ally' ? allySlotsState : enemySlotsState;
                if (!listEl) return;
                listEl.innerHTML = '';

                for (var i = 0; i < state.length; i++) {
                    (function (idx) {
                        var slot = state[idx];
                        var row = document.createElement('div');
                        row.className = 'slot-row';

                        var select = createUnitSelect(slot.unitId, function (e) {
                            state[idx].unitId = String(e.target.value || '').trim();
                            syncJsonTextareas();
                        });

                        var countInput = document.createElement('input');
                        countInput.type = 'number';
                        countInput.min = '1';
                        countInput.max = '30';
                        countInput.value = String(slot.count);
                        countInput.addEventListener('change', function () {
                            var n = Math.max(1, Math.min(30, Math.floor(Number(countInput.value) || 1)));
                            state[idx].count = n;
                            countInput.value = String(n);
                            syncJsonTextareas();
                        });

                        var delBtn = document.createElement('button');
                        delBtn.type = 'button';
                        delBtn.textContent = '삭제';
                        delBtn.addEventListener('click', function () {
                            state.splice(idx, 1);
                            if (state.length <= 0) state.push({ unitId: 'infantry', count: 1 });
                            renderSlotRows(team);
                            syncJsonTextareas();
                        });

                        row.appendChild(select);
                        row.appendChild(countInput);
                        row.appendChild(delBtn);
                        listEl.appendChild(row);
                    })(i);
                }
            }

            function addSlot(team, unitId, count) {
                var state = team === 'ally' ? allySlotsState : enemySlotsState;
                if (state.length >= MAX_SLOTS) return;
                var id = String(unitId || 'infantry').trim();
                if (!id) id = 'infantry';
                state.push({
                    unitId: id,
                    count: Math.max(1, Math.min(30, Math.floor(Number(count) || 1)))
                });
                renderSlotRows(team);
                syncJsonTextareas();
            }

            function syncJsonTextareas() {
                var allyJson = document.getElementById('ally-json');
                var enemyJson = document.getElementById('enemy-json');
                if (allyJson) allyJson.value = JSON.stringify(allySlotsState, null, 2);
                if (enemyJson) enemyJson.value = JSON.stringify(enemySlotsState, null, 2);
            }

            function fillFormFromConfig(cfg) {
                var c = cfg || {};
                document.getElementById('opt-enabled').checked = c.enabled === true;
                document.getElementById('opt-skip-boot').checked = c.skipBootGate !== false;
                document.getElementById('opt-open-custom').checked = c.autoOpenCustom !== false;
                document.getElementById('opt-auto-start').checked = c.autoStartCustom === true;
                document.getElementById('map-id').value = String(c.mapId || 'skirmish');

                allySlotsState = sanitizeSlotList(c.allySlots, defaultAlly);
                enemySlotsState = sanitizeSlotList(c.enemySlots, defaultEnemy);

                renderSlotRows('ally');
                renderSlotRows('enemy');
                syncJsonTextareas();
            }

            function buildConfigFromForm() {
                return {
                    enabled: document.getElementById('opt-enabled').checked === true,
                    skipBootGate: document.getElementById('opt-skip-boot').checked === true,
                    autoOpenCustom: document.getElementById('opt-open-custom').checked === true,
                    autoStartCustom: document.getElementById('opt-auto-start').checked === true,
                    mapId: String(document.getElementById('map-id').value || 'skirmish').trim() || 'skirmish',
                    allySlots: sanitizeSlotList(allySlotsState, defaultAlly),
                    enemySlots: sanitizeSlotList(enemySlotsState, defaultEnemy),
                    updatedAt: new Date().toISOString()
                };
            }

            function summarizeSlots(title, slots) {
                var text = slots.map(function (s) {
                    return getUnitLabel(s.unitId) + ' x' + s.count;
                }).join(', ');
                return title + ': ' + text;
            }

            function renderState() {
                var cfg = readConfig();
                fillFormFromConfig(cfg || {
                    enabled: false,
                    skipBootGate: true,
                    autoOpenCustom: true,
                    autoStartCustom: false,
                    mapId: 'skirmish',
                    allySlots: defaultAlly,
                    enemySlots: defaultEnemy
                });

                var localMode = isLocalRuntime();
                var statusText = localMode
                    ? '[로컬 환경] 빠른진입 동작 가능\n'
                    : '[원격 환경] 자동 빠른진입이 차단될 수 있음\n';
                statusText += '저장 키: ' + STORAGE_KEY + '\n';
                statusText += '저장 상태: ' + (cfg ? '있음' : '없음') + '\n';
                statusText += summarizeSlots('아군', allySlotsState) + '\n';
                statusText += summarizeSlots('적군', enemySlotsState);
                setStatus(statusText, null);
            }

            document.getElementById('btn-ally-add').addEventListener('click', function () {
                addSlot('ally', 'infantry', 1);
            });
            document.getElementById('btn-enemy-add').addEventListener('click', function () {
                addSlot('enemy', 'infantry', 1);
            });
            document.getElementById('btn-ally-default').addEventListener('click', function () {
                allySlotsState = cloneSlots(defaultAlly);
                renderSlotRows('ally');
                syncJsonTextareas();
            });
            document.getElementById('btn-enemy-default').addEventListener('click', function () {
                enemySlotsState = cloneSlots(defaultEnemy);
                renderSlotRows('enemy');
                syncJsonTextareas();
            });
            document.getElementById('btn-both-default').addEventListener('click', function () {
                allySlotsState = cloneSlots(defaultAlly);
                enemySlotsState = cloneSlots(defaultEnemy);
                renderSlotRows('ally');
                renderSlotRows('enemy');
                syncJsonTextareas();
            });

            document.getElementById('btn-json-apply').addEventListener('click', function () {
                try {
                    allySlotsState = parseSlotsJson(document.getElementById('ally-json').value, defaultAlly);
                    enemySlotsState = parseSlotsJson(document.getElementById('enemy-json').value, defaultEnemy);
                    renderSlotRows('ally');
                    renderSlotRows('enemy');
                    syncJsonTextareas();
                    setStatus('JSON 슬롯이 반영되었습니다.', true);
                } catch (err) {
                    setStatus('JSON 반영 실패: ' + (err && err.message ? err.message : String(err)), false);
                }
            });

            document.getElementById('btn-apply').addEventListener('click', function () {
                var inputPw = String(document.getElementById('password').value || '');
                if (inputPw !== MASTER_PASSWORD) {
                    setStatus('비밀번호가 올바르지 않습니다.', false);
                    return;
                }
                try {
                    var cfg = buildConfigFromForm();
                    cfg.enabled = true;
                    writeConfig(cfg);

                    var immediateResult = tryImmediateApply();

                    var msg = '저장 완료: 관리자 빠른진입 모드가 활성화되었습니다.\n';
                    msg += summarizeSlots('아군', cfg.allySlots) + '\n';
                    msg += summarizeSlots('적군', cfg.enemySlots) + '\n';
                    if (immediateResult.applied) {
                        msg += '실행 중인 index 창에도 즉시 반영되었습니다.';
                    } else if (immediateResult.pinged) {
                        msg += '실행 중인 index 창에 반영 요청을 보냈습니다. 잠시 후 확인하세요.';
                    } else {
                        msg += '열려 있는 index 창을 찾지 못했습니다. index.html을 열거나 새로고침하면 반영됩니다.';
                    }
                    setStatus(msg, true);
                } catch (err) {
                    setStatus('저장 실패: ' + (err && err.message ? err.message : String(err)), false);
                }
            });

            document.getElementById('btn-disable').addEventListener('click', function () {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                    setStatus('관리자 빠른진입 모드를 비활성화했습니다.', true);
                    renderState();
                } catch (err) {
                    setStatus('비활성화 실패: ' + (err && err.message ? err.message : String(err)), false);
                }
            });

            document.getElementById('btn-open-index').addEventListener('click', function () {
                try {
                    var opened = window.open('index.html', 'reclaim-main');
                    if (opened) {
                        mainGameWindow = opened;
                        if (typeof opened.focus === 'function') opened.focus();
                        setStatus('index.html 창을 열었습니다. 이후 저장 시 즉시 반영을 시도합니다.', true);
                        return;
                    }
                } catch (_) { }
                location.href = 'index.html';
            });

            document.getElementById('btn-show').addEventListener('click', function () {
                renderState();
            });

            renderState();
        })();
    </script>
</body>
</html>
